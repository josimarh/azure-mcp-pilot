[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idengraph"
version = "0.1.4"
description = "Identity & Access intelligence powered by Microsoft Graph and MCP. Read-only auditing for Microsoft Entra ID and Azure RBAC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "josimarh", email = "josimar.hedler@outlook.com" }]
keywords = ["mcp", "azure", "entra", "identity", "security", "rbac", "audit", "iam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp[cli]>=2,<3",
    "httpx>=0.28,<1",
    "azure-identity>=1.17,<2",
    "python-dotenv>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/josimarh/idengraph"
Repository = "https://github.com/josimarh/idengraph"
Issues = "https://github.com/josimarh/idengraph/issues"

[project.scripts]
idengraph = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.setuptools.package-data]
services = ["data/*.json"]
